[project]
name = "subvision"
version = "2.0.0"
description = "Hardsub extraction to SRT with Apple Vision OCR (engine of the SubVision macOS app)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "pillow>=13",
    "ocrmac>=1.0.1",
]

[project.scripts]
subvision = "subvision.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subvision"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
