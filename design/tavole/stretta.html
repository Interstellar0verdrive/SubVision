<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finestra stretta · tavole</title>
<link rel="stylesheet" href="tavole.css"><script src="strings.js"></script><script src="tavole.js"></script></head>
<body>
<div class="doc-head"><a href="index.html">← Indice</a><h1>Finestra stretta · N1–N2</h1><span class="sp"></span><span class="ctl"></span></div>
<p class="doc-intro">Sotto 1240 pt (o con la barra laterale nascosta da Vista) una barra in alto di 52 pt prende il posto della barra laterale (N1 di AnimeUp, approvata). Qui a 760 × 780. Sotto 1000 pt l'inspector si apre sovrapposto (dubbio ?2). Inventario §0.</p>
<main id="boards"></main>
<script src="kit.js"></script>
<script>
const { t, btn, chip, icon, board, win, pageHead } = SV;
const K = EK;
const rows = () => K.list([
  K.row({ st: 'done', name: 'Show S01E04 [1080p].mkv', dir: '~/Movies/Show/Season 1', dur: '23:40', fps: '23.976', res: '', result: t('app.row.done', { lines: 312, dropped: 9, refined: 588, t: '1 h 31 min' }), acts: K.reportBtn() }),
  K.row({ st: 'run', name: 'Show S01E05 [1080p].mkv', dir: '~/Movies/Show/Season 1', dur: '23:42', fps: '23.976', res: '',
    result: `<span style="color:var(--primaryText);font-weight:500">${t('app.row.file_of', { i: 2, n: 3 })}</span> · ${t('app.row.elapsed', { t: '41:20' })}`, acts: btn(t('app.btn.stop'), 'secondary', { size: 'sm', icon: 'stop' }),
    detail: K.steps('dlg', [['done', 'extract', 17040, '2:14'], ['done', 'group', 17040, '0:12'], ['run', 'ocr', 0.62, 10565, 17040, '38:54', '23:40', '4.5'], ['wait', 'refine', '6 min']]) }),
  K.row({ st: 'wait', name: 'sintel_ita_hardsub_demo.mp4', dir: '~/Downloads', dur: '0:55', fps: '24', res: '', result: t('app.row.waiting_est', { t: '3 min' }), rcls: 'ok' }),
], true);
board('N1', 'Finestra stretta, lotto in corso', 'Pallini, le tre pagine a segmenti (spinner su Elabora che lavora, capsula col numero dei video), a destra inspector e ingranaggio. La colonna Dimensioni sparisce; la scheda attività non c’è: il lotto si segue dalla barra in basso.', [760, 780], () => win({
  w: 760, h: 780, topbar: { tab: 'process', busy: ['process'], count: 3, inspector: true }, pageCls: 'narrowcols',
  page: pageHead(t('app.process.title'), '', K.openBtn()) + rows() +
    K.bottom(`<span class="sum">${t('app.bar.running', { i: 2, n: 3, time: '14:20' })}</span><span class="sp"></span>${btn(t('app.btn.stop_all'), 'destructive', { icon: 'stop', kbd: '⌘.' })}`),
}));
board('N2', 'Finestra stretta con inspector sovrapposto', 'Sotto 1000 pt di finestra l’inspector si apre sopra la pagina, da destra, con ombra; si chiude con Esc, con un clic fuori o con ⌥⌘I.', [760, 780], () => win({
  w: 760, h: 780, topbar: { tab: 'process', count: 3, inspector: true, inspectorOn: true }, pageCls: 'narrowcols', inspOver: true,
  page: pageHead(t('app.process.title'), '', K.openBtn()) + K.list([
      K.row({ st: 'ready', name: 'Show S01E04 [1080p].mkv', dir: '~/Movies/Show/Season 1', dur: '23:40', fps: '23.976', res: '' }),
      K.row({ st: 'ready', name: 'Show S01E05 [1080p].mkv', dir: '~/Movies/Show/Season 1', dur: '23:42', fps: '23.976', res: '' }),
      K.row({ st: 'ready', name: 'sintel_ita_hardsub_demo.mp4', dir: '~/Downloads', dur: '0:55', fps: '24', res: '' })], true) +
    K.bottom(`<span class="sum">${t('app.bar.ready', { n: 3, t: '48 min' })}</span><span class="sp"></span>${btn(t('app.bar.start'), 'primary', { icon: 'play', kbd: '⌘↩' })}`),
  insp: INSPECTOR({ closed: ['seg', 'adv'] }),
}));
</script>
</body></html>
