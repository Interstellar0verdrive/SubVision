<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elabora · tavole</title>
<link rel="stylesheet" href="tavole.css"><script src="strings.js"></script><script src="tavole.js"></script></head>
<body>
<div class="doc-head"><a href="index.html">← Indice</a><h1>Elabora · E0–E7</h1><span class="sp"></span><span class="ctl"></span></div>
<p class="doc-intro">La home dell'app: elenco dei video, barra in basso, inspector a destra (chiuso o aperto). Inventario §2. Finestra principale a 1360 × 840 pt (misura di avvio di AnimeUp, <code>WindowSizer.toMain</code>).</p>
<main id="boards"></main>
<script src="kit.js"></script>
<script>
const { t, btn, chip, note, link, bar, spin, icon, board, win, pageHead } = SV;
const K = window.EK;

// ---------- E0 · empty
board('E0', 'Elabora vuota', 'Nessun video: tre passi e area di trascinamento. Avvia non c’è ancora.', [1360, 840], () => win({
  side: { tab: 'process', subs: { process: t('app.sidebar.no_videos'), preview: t('app.sidebar.no_videos'), fix: t('app.sidebar.no_srt') } },
  page: pageHead(t('app.process.title'), t('app.process.intro'), K.inspBtn(false)) + `
    <div class="steps" style="margin-top:6px">
      ${[1, 2, 3].map(n => `<div class="step"><div class="n">${n}</div><h4>${t('app.process.empty.step' + n)}</h4><p>${t('app.process.empty.step' + n + '_text')}</p></div>`).join('')}
    </div>
    <div class="drop" style="flex:1;margin-top:18px">
      <span style="color:var(--text3)">${icon('film', 40)}</span>
      <div class="big">${t('app.process.empty.drop')}</div>
      <div>${t('app.process.empty.or_open')} ${btn(t('app.process.open'), 'primary', { kbd: '⌘O' })}</div>
      <div class="num t3" style="font-size:11px">${t('app.process.empty.formats')}</div>
    </div>`,
}));

// ---------- E1 · with videos, ready
board('E1', 'Elabora con video, pronto', 'Tre video pronti, uno con l’SRT già presente, un file illeggibile, nota degli elementi saltati. Inspector chiuso.', [1360, 840], () => win({
  side: { tab: 'process', subs: { process: t('app.sidebar.videos', { n: 3 }), preview: 'Show S01E04 [1080p].mkv', fix: t('app.sidebar.no_srt') } },
  page: pageHead(t('app.process.title'), t('app.process.intro'), K.openBtn() + K.inspBtn(false)) +
    note('yellow', t('app.process.note.skipped', { n: 2 }), 'cover.jpg, notes.txt', `<span style="color:var(--yellowText)">${icon('x', 14)}</span>`) +
    `<div style="height:14px"></div>` +
    K.list([
      K.row({ st: 'ready', name: 'Show S01E04 [1080p].mkv', dir: '~/Movies/Show/Season 1', dur: '23:40', fps: '23.976', res: '1920×1080' }),
      K.row({ st: 'ready', name: 'Show S01E05 [1080p].mkv', dir: '~/Movies/Show/Season 1', dur: '23:42', fps: '23.976', res: '1920×1080', chips: chip(t('app.process.row.srt_exists')) }),
      K.row({ st: 'ready', name: 'sintel_ita_hardsub_demo.mp4', dir: '~/Downloads', dur: '0:55', fps: '24', res: '1280×544' }),
      K.row({ st: 'bad', name: 'Show S01E06 (broken).mkv', dir: '~/Movies/Show/Season 1', dur: '—', fps: '—', res: '—', result: t('app.process.row.unreadable'), rcls: 'fail', dim: true }),
    ], true) +
    `<div class="drop" style="flex-direction:row;padding:12px;margin-top:10px;font-size:12px">${icon('plus', 14)} ${t('app.process.list.drop_more')}</div>` +
    K.bottom(`<span class="sum">${t('app.process.bar.ready', { n: 3, t: '48 min' })}</span><span class="small" style="max-width:520px">${t('app.process.bar.outputs')}</span><span class="sp"></span>${btn(t('app.process.bar.start'), 'primary', { icon: 'play', kbd: '⌘↩' })}`),
}));

// ---------- E2 · running
board('E2', 'Elabora in corso', 'File 2 di 3 aperto con le tappe per banda (fatta, in corso con ETA e velocità, in attesa con stima). Inspector aperto e bloccato. Scheda attività in basso a sinistra. Nella barra, due video trascinati durante il lotto: pronti per il prossimo (dubbio ?10).', [1360, 840], () => win({
  side: {
    tab: 'process', trail: { process: 'busy' },
    subs: { process: SV.tj(t('app.sidebar.videos', { n: 3 }), t('app.sidebar.running')), preview: t('app.sidebar.prev_readonly'), fix: t('app.sidebar.no_srt') },
    card: SV.activity(t('app.sidebar.batch'), t('app.sidebar.batch_line', { i: 2, n: 3, name: 'Show S01E05 [1080p].mkv' }) + '<br>' + t('app.sidebar.batch_ends', { time: '14:20' }), 0.47,
      btn(t('app.common.stop_all'), 'secondary', { size: 'sm', icon: 'stop', full: true })),
  },
  page: pageHead(t('app.process.title'), '', K.openBtn() + K.inspBtn(true)) +
    K.list([
      K.row({ st: 'done', name: 'Show S01E04 [1080p].mkv', dir: '~/Movies/Show/Season 1', dur: '23:40', fps: '23.976', res: '1920×1080',
        result: SV.tj(t('app.process.row.lines', { n: 312 }), t('app.process.row.dropped', { n: 9 }), t('app.process.row.refined', { n: 588 }), '1 h 31 min'), acts: K.reportBtn() }),
      K.row({ st: 'run', name: 'Show S01E05 [1080p].mkv', dir: '~/Movies/Show/Season 1', dur: '23:42', fps: '23.976', res: '1920×1080',
        result: `<span style="color:var(--primaryText);font-weight:500">${t('app.process.row.file_of', { i: 2, n: 3 })}</span> · ${t('app.process.row.elapsed', { t: '41:20' })}`,
        acts: btn(t('app.common.stop'), 'secondary', { size: 'sm', icon: 'stop' }),
        detail: K.steps('dlg', [['done', 'extract', 17040, '2:14', '127'], ['done', 'group', 17040, '0:12'], ['run', 'ocr', 0.62, 10565, 17040, '38:54', '23:40', '4.5'], ['wait', 'refine', '6 min']])
              + K.steps('sig', [['wait', 'extract', '2 min'], ['wait', 'group', '1 min'], ['wait', 'ocr', '45 min'], ['wait', 'refine', '2 min']]) }),
      K.row({ st: 'wait', name: 'sintel_ita_hardsub_demo.mp4', dir: '~/Downloads', dur: '0:55', fps: '24', res: '1280×544', result: t('app.process.row.waiting_est', { t: '3 min' }), rcls: 'ok' }),
    ], true) +
    K.bottom(`<span class="sum">${t('app.process.bar.running', { i: 2, n: 3, time: '14:20' })}</span>${chip(t('app.process.bar.next_batch', { n: 2 }))}<span class="sp"></span>${btn(t('app.common.stop_all'), 'destructive', { icon: 'stop', kbd: '⌘.' })}`),
  insp: window.INSPECTOR ? window.INSPECTOR({ locked: true }) : '',
}));

// ---------- E3 · finished with outcomes
board('E3', 'Elabora finita, con esiti', 'Fatto (riga aperta con tempi e trittico), senza sottotitoli, fallito, fermato.', [1360, 840], () => win({
  side: { tab: 'process', subs: { process: SV.tj(t('app.sidebar.videos', { n: 4 }), t('app.sidebar.failed', { n: 1 })), preview: 'Show S01E04 [1080p].mkv', fix: t('app.sidebar.no_srt') } },
  page: pageHead(t('app.process.title'), t('app.process.intro'), K.openBtn() + K.inspBtn(false)) +
    K.list([
      K.row({ st: 'done', name: 'Show S01E04 [1080p].mkv', dir: '~/Movies/Show/Season 1', dur: '23:40', fps: '23.976', res: '1920×1080',
        result: SV.tj(t('app.process.row.lines', { n: 312 }), t('app.process.row.dropped', { n: 9 }), t('app.process.row.refined', { n: 588 }), '1 h 31 min'), acts: K.reportBtn() + K.more(), open: true,
        detail: K.doneDetail() }),
      K.row({ st: 'warn', name: 'Show S01E05 [1080p].mkv', dir: '~/Movies/Show/Season 1', dur: '23:42', fps: '23.976', res: '1920×1080',
        result: t('app.process.row.no_subs'), rcls: 'warn', acts: K.reportBtn() + K.more() }),
      K.row({ st: 'fail', name: 'sintel_ita_hardsub_demo.mp4', dir: '~/Downloads', dur: '0:55', fps: '24', res: '1280×544',
        result: t('app.process.row.failed', { step: t('app.steps.ocr', { n: 3 }), band: t('app.steps.band.dialogue_l'), error: 'Vision request failed (-1)' }), rcls: 'fail',
        acts: btn(t('app.process.row.open_log'), 'secondary', { size: 'sm' }) + btn(t('app.process.row.process_again'), 'secondary', { size: 'sm' }) }),
      K.row({ st: 'stop', name: 'Show S01E06 [1080p].mkv', dir: '~/Movies/Show/Season 1', dur: '23:39', fps: '23.976', res: '1920×1080',
        result: t('app.process.row.stopped', { step: t('app.steps.extract'), band: t('app.steps.band.signs_l') }), rcls: 'ok',
        acts: btn(t('app.process.row.process_again'), 'secondary', { size: 'sm' }) }),
    ], true) +
    K.bottom(`<span class="sum">${SV.tj(t('app.process.bar.done', { n: 1 }), t('app.process.bar.no_subs', { n: 1 }), t('app.process.bar.failed', { n: 1 }))}</span><span class="sp"></span>${btn(t('app.process.bar.clear_done'), 'secondary')}${btn(t('app.process.bar.start'), 'primary', { icon: 'play', kbd: '⌘↩', dis: true })}`),
}));

// ---------- E4 · failed file
board('E4', 'File fallito', 'La riga aperta: la tappa interrotta in rosso, le tappe dopo non eseguite, l’errore e il log.', [1360, 840], () => win({
  side: { tab: 'process', subs: { process: SV.tj(t('app.sidebar.videos', { n: 1 }), t('app.sidebar.failed', { n: 1 })), preview: 'sintel_ita_hardsub_demo.mp4', fix: t('app.sidebar.no_srt') } },
  page: pageHead(t('app.process.title'), t('app.process.intro'), K.openBtn() + K.inspBtn(false)) +
    K.list([
      K.row({ st: 'fail', name: 'sintel_ita_hardsub_demo.mp4', dir: '~/Downloads', dur: '0:55', fps: '24', res: '1280×544',
        result: t('app.process.row.failed', { step: t('app.steps.ocr', { n: 3 }), band: t('app.steps.band.dialogue_l'), error: 'Vision request failed (-1)' }), rcls: 'fail', open: true,
        acts: btn(t('app.process.row.open_log'), 'secondary', { size: 'sm' }) + btn(t('app.process.row.process_again'), 'secondary', { size: 'sm' }),
        detail: K.steps('dlg', [['done', 'extract', 660, '0:01', '660'], ['done', 'group', 660, '0:00'], ['fail', 'ocr'], ['skip', 'refine']])
          + K.steps('sig', [['skip', 'extract'], ['skip', 'group'], ['skip', 'ocr'], ['skip', 'refine']])
          + `<div class="textbox mono" style="margin-top:12px;color:var(--redText)">OCRError: Vision request failed (-1) · frame 000412.jpg
log: ~/Downloads/sintel_ita_hardsub_demo.log</div>` }),
    ], true) +
    K.bottom(`<span class="sum">${t('app.process.bar.failed', { n: 1 })}</span><span class="sp"></span>${btn(t('app.process.bar.clear_done'), 'secondary')}${btn(t('app.process.bar.start'), 'primary', { icon: 'play', kbd: '⌘↩', dis: true })}`),
}));

// ---------- E5 · stopped file / stopped batch
board('E5', 'File fermato e lotto fermato', 'Sopra: dopo Ferma il file è fermato e il lotto passa al successivo. Sotto: dopo Ferma tutto i file non partiti tornano pronti. Nessuno stato “sto fermando”.', [1360, 840], () => win({
  side: { tab: 'process', subs: { process: SV.tj(t('app.sidebar.videos', { n: 3 }), t('app.sidebar.stopped', { n: 1 })), preview: 'Show S01E04 [1080p].mkv', fix: t('app.sidebar.no_srt') } },
  page: pageHead(t('app.process.title'), '', K.openBtn() + K.inspBtn(false)) +
    `<div class="cap label" style="margin-bottom:6px">${SV.lang === 'en' ? 'After Stop (this file)' : 'Dopo Ferma (questo file)'}</div>` +
    K.list([
      K.row({ st: 'stop', name: 'Show S01E04 [1080p].mkv', dir: '~/Movies/Show/Season 1', dur: '23:40', fps: '23.976', res: '1920×1080', result: t('app.process.row.stopped', { step: t('app.steps.ocr', { n: 3 }), band: t('app.steps.band.dialogue_l') }), rcls: 'ok', acts: btn(t('app.process.row.process_again'), 'secondary', { size: 'sm' }) }),
      K.row({ st: 'run', name: 'Show S01E05 [1080p].mkv', dir: '~/Movies/Show/Season 1', dur: '23:42', fps: '23.976', res: '1920×1080', result: `<span style="color:var(--primaryText);font-weight:500">${t('app.process.row.file_of', { i: 2, n: 3 })}</span> · ${t('app.process.row.elapsed', { t: '0:04' })}`, acts: btn(t('app.common.stop'), 'secondary', { size: 'sm', icon: 'stop' }) }),
      K.row({ st: 'wait', name: 'sintel_ita_hardsub_demo.mp4', dir: '~/Downloads', dur: '0:55', fps: '24', res: '1280×544', result: t('app.process.row.waiting'), rcls: 'ok' }),
    ], true) +
    `<div class="cap label" style="margin:22px 0 6px">${SV.lang === 'en' ? 'After Stop All' : 'Dopo Ferma tutto'}</div>` +
    K.list([
      K.row({ st: 'done', name: 'Show S01E04 [1080p].mkv', dir: '~/Movies/Show/Season 1', dur: '23:40', fps: '23.976', res: '1920×1080', result: SV.tj(t('app.process.row.lines', { n: 312 }), t('app.process.row.dropped', { n: 9 }), t('app.process.row.refined', { n: 588 }), '1 h 31 min'), acts: K.reportBtn() + K.more() }),
      K.row({ st: 'stop', name: 'Show S01E05 [1080p].mkv', dir: '~/Movies/Show/Season 1', dur: '23:42', fps: '23.976', res: '1920×1080', result: t('app.process.row.stopped', { step: t('app.steps.extract'), band: t('app.steps.band.signs_l') }), rcls: 'ok', acts: btn(t('app.process.row.process_again'), 'secondary', { size: 'sm' }) }),
      K.row({ st: 'ready', name: 'sintel_ita_hardsub_demo.mp4', dir: '~/Downloads', dur: '0:55', fps: '24', res: '1280×544', result: t('app.process.row.ready'), rcls: 'ok' }),
    ], true) +
    K.bottom(`<span class="sum">${SV.tj(t('app.process.bar.stopped'), t('app.process.bar.done', { n: 1 }), t('app.process.bar.ready_count', { n: 1 }))}</span><span class="sp"></span>${btn(t('app.process.bar.clear_done'), 'secondary')}${btn(t('app.process.bar.start'), 'primary', { icon: 'play', kbd: '⌘↩' })}`),
}));

// ---------- E6 · finished sheet
function finSheet(mixed) {
  const rows = mixed
    ? [['done', 'Show S01E04 [1080p].mkv', t('app.process.finished.lines', { n: 312 }), true], ['warn', 'Show S01E05 [1080p].mkv', t('app.process.finished.no_subs'), true], ['fail', 'sintel_ita_hardsub_demo.mp4', t('app.process.finished.failed_at', { step: t('app.steps.ocr', { n: 3 }) }), false]]
    : [['done', 'Show S01E04 [1080p].mkv', t('app.process.finished.lines', { n: 312 }), true], ['done', 'Show S01E05 [1080p].mkv', t('app.process.finished.lines', { n: 298 }), true], ['done', 'sintel_ita_hardsub_demo.mp4', t('app.process.finished.lines', { n: 12 }), true]];
  const ic = { done: 'check', warn: 'warn', fail: 'x' };
  return `<div class="veil"></div><div class="sheet" style="width:520px">
    <div style="font-weight:700;font-size:16px">${mixed ? SV.tj(t('app.process.finished.title', { n: 1 }), t('app.process.bar.no_subs', { n: 1 }), t('app.process.bar.failed', { n: 1 })) : t('app.process.finished.title', { n: 3 })}</div>
    <div class="small" style="margin:4px 0 14px">${t('app.process.finished.text')} ${t('app.process.finished.took', { t: '3 h 04 min' })}</div>
    <div class="list">${rows.map(r => `<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)">
      <span class="sicon ${r[0]}">${icon(ic[r[0]], 14)}</span><div style="flex:1;min-width:0"><div class="fname">${r[1]}</div><div class="fres ${r[0] === 'done' ? 'ok' : r[0]}">${r[2]}</div></div>
      ${r[3] ? btn(t('app.process.row.open_report'), 'secondary', { size: 'sm' }) : btn(t('app.process.row.open_log'), 'secondary', { size: 'sm' })}</div>`).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:16px"><span class="sp" style="flex:1"></span>${btn(t('app.process.finished.show_all'), 'secondary')}${btn(t('app.common.ok'), 'primary')}</div></div>`;
}
board('E6', 'Foglio di fine lotto', 'Il foglio sopra la finestra, nel caso misto (un file senza sottotitoli, uno fallito). Con tutto ok il titolo è “3 SRT pronti” e ogni riga ha Apri report. Si apre alla fine del lotto (o alla riapertura, se non visto).', [1360, 840], () => win({
  side: { tab: 'process', subs: { process: SV.tj(t('app.sidebar.videos', { n: 3 }), t('app.sidebar.failed', { n: 1 })), preview: 'Show S01E04 [1080p].mkv', fix: t('app.sidebar.no_srt') }, inactive: true },
  page: pageHead(t('app.process.title'), t('app.process.intro'), K.openBtn() + K.inspBtn(false)) +
    K.list([
      K.row({ st: 'done', name: 'Show S01E04 [1080p].mkv', dir: '~/Movies/Show/Season 1', dur: '23:40', fps: '23.976', res: '1920×1080', result: SV.tj(t('app.process.row.lines', { n: 312 }), t('app.process.row.dropped', { n: 9 }), t('app.process.row.refined', { n: 588 }), '1 h 31 min'), acts: K.reportBtn() + K.more() }),
      K.row({ st: 'warn', name: 'Show S01E05 [1080p].mkv', dir: '~/Movies/Show/Season 1', dur: '23:42', fps: '23.976', res: '1920×1080', result: t('app.process.row.no_subs'), rcls: 'warn', acts: K.reportBtn() + K.more() }),
      K.row({ st: 'fail', name: 'sintel_ita_hardsub_demo.mp4', dir: '~/Downloads', dur: '0:55', fps: '24', res: '1280×544', result: t('app.process.row.failed', { step: t('app.steps.ocr', { n: 3 }), band: t('app.steps.band.dialogue_l'), error: 'Vision request failed (-1)' }), rcls: 'fail', acts: btn(t('app.process.row.open_log'), 'secondary', { size: 'sm' }) }),
    ], true) + K.bottom(`<span class="sum">${SV.tj(t('app.process.bar.done', { n: 1 }), t('app.process.bar.no_subs', { n: 1 }), t('app.process.bar.failed', { n: 1 }))}</span><span class="sp"></span>${btn(t('app.process.bar.clear_done'), 'secondary')}`),
  overlay: finSheet(true),
}));

// ---------- E7 · banners and notes
board('E7', 'Banner e note', 'Vision mancante: banner rosso in cima, Avvia spento. Spazio stretto sul disco: nota gialla nella barra.', [1360, 840], () => win({
  side: { tab: 'process', subs: { process: t('app.sidebar.videos', { n: 2 }), preview: 'Show S01E04 [1080p].mkv', fix: t('app.sidebar.no_srt') } },
  page: pageHead(t('app.process.title'), t('app.process.intro'), K.openBtn() + K.inspBtn(false)) +
    note('red', t('app.process.note.vision_title'), t('app.process.note.vision_text'), SV.tint(t('app.common.retry')) + SV.tint(t('app.common.show_log'))) +
    `<div style="height:14px"></div>` +
    K.list([
      K.row({ st: 'ready', name: 'Show S01E04 [1080p].mkv', dir: '~/Movies/Show/Season 1', dur: '23:40', fps: '23.976', res: '1920×1080' }),
      K.row({ st: 'ready', name: 'Show S01E05 [1080p].mkv', dir: '~/Movies/Show/Season 1', dur: '23:42', fps: '23.976', res: '1920×1080' }),
    ], true) +
    `<div style="margin-top:auto"></div>` +
    `<div style="margin:0 0 12px">${note('yellow', '', t('app.process.bar.disk_low', { free: 6, need: 3 }))}</div>` +
    K.bottom(`<span class="sum">${t('app.process.bar.ready', { n: 2, t: '47 min' })}</span><span class="small">${t('app.process.bar.outputs')}</span><span class="sp"></span>${btn(t('app.process.bar.start'), 'primary', { icon: 'play', kbd: '⌘↩', dis: true })}`, true),
}));
</script>
</body></html>
