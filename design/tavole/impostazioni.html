<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impostazioni · tavole</title>
<link rel="stylesheet" href="tavole.css"><script src="strings.js"></script><script src="tavole.js"></script></head>
<body>
<div class="doc-head"><a href="index.html">← Indice</a><h1>Impostazioni · ST1–ST5</h1><span class="sp"></span><span class="ctl"></span></div>
<p class="doc-intro">Finestra ⌘, a 640 pt con <code>SettingsKit</code> di AnimeUp: schede con simbolo, gruppi, “Predefinito: …” sotto ogni voce che ne ha uno. Solo le cose dell'app (D5): i parametri OCR stanno nell'inspector. Inventario §7, dubbi ?12, ?20.</p>
<main id="boards"></main>
<script>
const { t, btn, note, icon, board, toggle, capseg, popup } = SV;
const TABS = [['general', 'gear'], ['tools', 'wrench'], ['lists', 'list'], ['updates', 'refresh']];
function swin(tab, body) {
  return `<div class="swin"><div class="swin-tb">${SV.lights()}<div class="ttl">${t('app.set.tab.' + tab)}</div>
    <div class="swin-tabs">${TABS.map(([k, ic]) => `<span class="stab ${k === tab ? 'on' : ''}">${icon(ic, 20)}${t('app.set.tab.' + k)}</span>`).join('')}</div></div>
    <div class="swin-b">${body}</div></div>`;
}
const row = (title, desc, def, ctl, dis) => `<div class="srowk ${dis ? 'dis' : ''}"><div class="lt"><div class="a">${title}</div>${desc ? `<div class="d">${desc}</div>` : ''}${def ? `<div class="df">${t('app.set.default', { value: def })}</div>` : ''}</div>${ctl}</div>`;
const group = (title, rows) => `<div class="sgroup">${title ? `<div class="gt">${title}</div>` : ''}<div class="sbox">${rows}</div></div>`;

function general() {
  return swin('general', group('', row(t('app.set.language'), t('app.set.language_desc'), '', capseg(['English', 'Italiano'], SV.lang === 'en' ? 0 : 1))
    + row(t('app.set.appearance'), t('app.set.appearance_desc'), t('app.set.theme.system'), capseg([t('app.set.theme.system'), t('app.set.theme.light'), t('app.set.theme.dark')], 0)))
    + group(t('app.set.while_processing'), row(t('app.set.notifications'), t('app.set.notifications_desc'), t('app.set.on'), toggle(true))
    + row(t('app.set.dock'), '', t('app.set.on'), toggle(true))));
}
function tools(o = {}) {
  const lock = o.locked;
  const own = o.own;
  const ff = row(t('app.set.ffmpeg'), t('app.set.ffmpeg_desc'), t('app.set.ffmpeg_default'), popup(own ? t('app.set.ffmpeg_own') : t('app.set.ffmpeg_bundled'), 250, lock), lock)
    + (own ? `<div class="srowk"><div class="lt"><div class="a">${t('app.set.ffmpeg_path')}</div>
         <div class="d" style="color:var(--redText)">${icon('err', 11)} ${t('app.set.ffmpeg_fails', { error: 'dyld: Library not loaded: libx264.164.dylib' })}</div></div>
         <span style="display:flex;gap:8px">${SV.field('/usr/local/bin/ffmpeg', 200)}${btn(t('app.btn.choose'), 'secondary', { size: 'sm' })}</span></div>`
      : row(t('app.set.version'), t('app.set.version_val'), '', o.downloading ? `<span style="display:flex;gap:8px;align-items:center;width:220px">${SV.spin('s')}<span class="small" style="white-space:nowrap">${t('app.set.downloading', { done: 31, total: 57 })}</span>${SV.bar(.54)}</span>` : btn(t('app.set.download_again'), 'secondary', { dis: lock }), lock));
  const info = row(t('app.set.engine'), '', '', `<span class="num small">${t('app.set.engine_val')}</span>`) + row(t('app.set.recognition'), '', '', `<span class="num small">${t('app.set.recognition_val')}</span>`);
  return swin('tools', (lock ? note('yellow', t('app.set.locked_title'), t('app.set.locked_text')) : '') + group('', ff) + group('', info));
}
function lists(o = {}) {
  const r = (k, n) => `<div class="srowk"><div class="lt"><div class="a">${t('app.set.' + k)}</div><div class="d">${t('app.set.' + k + '_desc', { n })}</div></div>
    <span style="display:flex;gap:6px">${btn(t('app.set.edit'), 'secondary', { size: 'sm' })}${btn(t('app.set.import'), 'secondary', { size: 'sm' })}<span class="iconbtn" style="width:24px;height:24px" title="${t('app.btn.show_in_finder')}">${icon('folder', 14)}</span></span></div>`;
  return swin('lists', group('', r('ignore', 12) + r('corr', 4)) + `<div class="small">${t('app.set.lists_note')}</div>
    <div class="small num t3">~/Library/Application Support/SubVision</div>`);
}
function updates(state) {
  const title = state === 'ok' ? t('app.set.up_to_date', { version: '2.0.0' }) : state === 'new' ? t('app.set.update_available', { version: '2.0.1' }) : t('app.set.update_error');
  const color = state === 'new' ? 'var(--yellowText)' : state === 'err' ? 'var(--redText)' : 'var(--text)';
  return swin('updates', group('', row(t('app.set.auto_check'), t('app.set.auto_check_desc'), t('app.set.on'), toggle(true)))
    + `<div class="sbox" style="display:flex;align-items:center;gap:12px;padding:14px"><div style="flex:1"><div style="font-weight:600;color:${color}">${title}</div><div class="small">${t('app.set.last_checked', { when: t('app.set.today_at') })}</div></div>
      ${state === 'new' ? btn(t('app.btn.download'), 'notice') : ''}${btn(t('app.set.check_now'))}</div>
      <div style="display:flex;gap:16px">${SV.link(t('app.set.release_notes'), '', 'ext')}${SV.link(t('app.set.on_github'), '', 'ext')}</div>`);
}
board('ST1', 'Generali', 'Lingua (English/Italiano), Aspetto (Sistema/Chiaro/Scuro, cambia al volo), notifiche e Dock.', [640, 440], () => general());
board('ST2', 'Strumenti', 'Sinistra: quelli scaricati, con Scarica di nuovo in corso. Destra: “Uno mio…” che non parte (percorso, errore, Scegli…). Sotto: motore e riconoscimento, solo lettura.', [1320, 480], () => tools({ downloading: true }) + tools({ own: true }), { row: true });
board('ST3', 'Elenchi', 'ignore.txt e correzioni.txt con il conteggio, Modifica… (editor di sistema), Importa…, Mostra nel Finder; a destra l’avviso dopo Importa…', [1080, 420], () => lists() + SV.alert({ icon: 'list', tone: 'accent', title: t('app.alert.import_title'), texts: [t('app.alert.import_text')], buttons: [[t('app.alert.import_add'), 'primary'], [t('app.alert.import_replace')], [t('app.btn.cancel')]] }), { row: true });
board('ST4', 'Aggiornamenti', 'Tre stati del riquadro: aggiornato; nuova versione (giallo, Scarica…); GitHub non ha risposto.', [1360, 700], () =>
  `<div style="display:grid;grid-template-columns:640px 640px;gap:40px 80px">${updates('ok')}${updates('new')}${updates('err')}</div>`);
board('ST5', 'Bloccate durante il lotto', 'Strumenti ed Elenchi si bloccano con la nota gialla; Generali e Aggiornamenti restano libere (dubbio ?12).', [640, 480], () => tools({ locked: true }));
</script>
</body></html>
